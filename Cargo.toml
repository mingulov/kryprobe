# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
resolver = "2"
members = ["xtask", "crates/kryprobe-abi", "crates/kryprobe-testkit", "crates/kryprobe-core", "crates/kryprobe-privilege", "crates/kryprobe-report", "crates/kryprobe-policy", "crates/kryprobe-cli"]
# crates/bpf-spine and crates/bpf-kcrypto are excluded: the bpf-target
# `no_std` bins never enter the host build (osslscope precedent: BPF
# objects built separately with the pinned nightly + bpf-linker lane,
# see docs/dependencies/pins.md in T7).
exclude = ["crates/bpf-spine", "crates/bpf-kcrypto"]

# Shared package metadata (BP-L4): every member inherits via
# `<key>.workspace = true` (enforced by `xtask check`'s manifest
# gate). The BPF crates are workspace-excluded and keep explicit
# fields instead (see their manifests).
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.98"

# Shared intra-workspace deps: one version+path pin per crate (members
# inherit via `kryprobe-*.workspace = true`). Explicit versions keep
# `cargo deny check bans` (`wildcards = "deny"`) green — bare path deps
# read as wildcards. Bump alongside `[workspace.package] version`.
[workspace.dependencies]
kryprobe-abi = { version = "0.1.0", path = "crates/kryprobe-abi" }
kryprobe-testkit = { version = "0.1.0", path = "crates/kryprobe-testkit" }
kryprobe-core = { version = "0.1.0", path = "crates/kryprobe-core" }
kryprobe-privilege = { version = "0.1.0", path = "crates/kryprobe-privilege" }
kryprobe-report = { version = "0.1.0", path = "crates/kryprobe-report" }
kryprobe-policy = { version = "0.1.0", path = "crates/kryprobe-policy" }

# Shared lint table (BP-M3): every member inherits via `[lints]
# workspace = true`. The gate runs clippy with `-D warnings`, so
# `warn` here denies in CI. Deliberately NOT included: `pedantic`
# (861 hits — adopt piecemeal, not wholesale), `unwrap_used` /
# `expect_used` (~273 mostly-test hits), `unsafe_code` (legitimate
# wire/FFI unsafe in abi/testkit/privilege; the privilege seam is
# enforced by `xtask check`'s seam gate instead), `mod_module_files`
# (forbids the `kcrypto_backend/mod.rs` layout 1A-M10 prescribes).
[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
bare_trait_objects = "warn"

[workspace.lints.clippy]
useless_conversion = "warn"
