[workspace]
resolver = "2"
members = ["xtask", "crates/kryprobe-abi", "crates/kryprobe-testkit"]
# crates/bpf-spine is excluded: the bpf-target `no_std` bin never enters the
# host build (osslscope precedent: BPF object built separately with the
# pinned nightly + bpf-linker lane, see docs/dependencies/pins.md in T7).
exclude = ["crates/bpf-spine"]
