# SPDX-License-Identifier: GPL-3.0-or-later
# Release pipeline: the ONLY supported path to a published KryProbe release.
#
# Trust model: the pipeline never trusts staging bytes. It downloads the
# staging draft, verifies every byte against packaging/release-pins.json
# (hashes pinned in public git), assembles deterministically (double-build
# byte comparison), uploads the pipeline-built bytes over the staging draft,
# downloads them back, verifies, and only then publishes. A human couriers
# measured bytes into the staging draft; the pipeline enforces the pins.
#
# v0.1.0 bootstrap: the tag predates this workflow, so v0.1.0 runs via
# workflow_dispatch with tools_ref set to the main commit that carries the
# release tooling. The run logs both SHAs. Later releases trigger on tag
# push directly (workflow and tools come from the tag itself).
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (must already exist)
        required: true
        default: v0.1.0
      tools_ref:
        description: 'Ref carrying packaging/release/* (default: the tag itself)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  require-green:
    name: require exact-commit CI
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      peel: ${{ steps.resolve.outputs.peel }}
      tooling_sha: ${{ steps.tooling.outputs.tooling_sha }}
      ci_run: ${{ steps.wait.outputs.run_id }}
    steps:
      - name: resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          PEEL="$(git ls-remote "https://github.com/${{ github.repository }}.git" "refs/tags/$TAG" "refs/tags/$TAG^{}" | awk '/\^\{\}$/{print $1}')"
          test -n "$PEEL" || { echo "tag $TAG has no peeled commit" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "peel=$PEEL" >> "$GITHUB_OUTPUT"
          echo "tag $TAG peels to $PEEL"
      - name: resolve tooling ref
        id: tooling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TOOLS_REF="${{ inputs.tools_ref || steps.resolve.outputs.tag }}"
          if printf '%s' "$TOOLS_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            TOOLING_SHA="$TOOLS_REF"
          else
            TOOLING_SHA="$(git ls-remote "https://github.com/${{ github.repository }}.git" "refs/tags/$TOOLS_REF" "refs/tags/$TOOLS_REF^{}" "refs/heads/$TOOLS_REF" | awk '/\^\{\}$/{peeled=$1} !/\^\{\}$/{plain=$1} END{if (peeled != "") print peeled; else print plain}')"
          fi
          test -n "$TOOLING_SHA" || { echo "tooling ref has no commit" >&2; exit 1; }
          printf '%s' "$TOOLING_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "tooling SHA malformed" >&2; exit 1; }
          echo "tooling_sha=$TOOLING_SHA" >> "$GITHUB_OUTPUT"
          echo "tooling $TOOLS_REF resolves to $TOOLING_SHA"
      - name: checkout release tooling
        # Pinned: actions/checkout v4.2.2 (release pipelines pin actions).
        # The verifier below runs from this trusted checkout at the resolved
        # full tooling SHA, never from the tag tree or the dispatch default.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.tooling.outputs.tooling_sha }}
          path: tools
          fetch-depth: 1
      - name: wait for green ci.yml on the tag commit
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PEEL="${{ steps.resolve.outputs.peel }}"
          for _ in $(seq 1 60); do
            ROW="$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --event push --commit "$PEEL" --limit 1 --json databaseId,status,conclusion --jq '.[0] | "\(.databaseId) \(.status) \(.conclusion)"')"
            set -- $ROW
            if [ -n "${1:-}" ] && [ "$2" = completed ]; then
              test "$3" = success || { echo "CI $1 concluded $3; refusing release" >&2; exit 1; }
              gh run view "$1" --repo "${{ github.repository }}" --json headSha,status,conclusion,jobs > run.json
              python3 tools/packaging/release/verify-ci.py --expected-sha "$PEEL" --run-json run.json
              echo "run_id=$1" >> "$GITHUB_OUTPUT"
              echo "exact-commit CI green: $1"
              exit 0
            fi
            sleep 60
          done
          echo "timed out waiting for green CI on $PEEL" >&2
          exit 1

  publish:
    name: verify, assemble and publish
    runs-on: ubuntu-latest
    needs: require-green
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      TAG: ${{ needs.require-green.outputs.tag }}
      PEEL: ${{ needs.require-green.outputs.peel }}
      TOOLS_REF: ${{ needs.require-green.outputs.tooling_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: checkout tag sources
        # Pinned: actions/checkout v4.2.2 (release pipelines pin actions).
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TAG }}
          path: src
          fetch-depth: 0
      - name: checkout release tooling
        # Bootstrap note: v0.1.0 dispatches with tools_ref set to the reviewed
        # main commit carrying packaging/release/*, because the tag predates
        # the tooling. require-green resolves that ref (or the tag itself for
        # later releases) to a full immutable tooling SHA, and publish
        # consumes the same SHA: this checkout cannot drift from the tree
        # the verifier ran from. Audit the dispatch against that SHA.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TOOLS_REF }}
          path: tools
          fetch-depth: 1
      - name: record identities
        run: |
          set -euo pipefail
          test "$(git -C src rev-parse HEAD)" = "$PEEL"
          test "$(git -C tools rev-parse HEAD)" = "$TOOLS_REF"
          echo "sources: tag $TAG peel $PEEL tree $(git -C src rev-parse 'HEAD^{tree}')"
          echo "tooling: $TOOLS_REF sha $(git -C tools rev-parse HEAD)"
          test -f tools/packaging/release-pins.json
          test -f tools/packaging/release/verify-inputs.py
          test -f tools/packaging/release/assemble.py
          command -v readelf python3 gh
      - name: download staging draft
        run: |
          set -euo pipefail
          ISDRAFT="$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)"
          test "$ISDRAFT" = "true" || { echo "no staging draft for $TAG" >&2; exit 1; }
          gh release download "$TAG" --repo "${{ github.repository }}" --dir staging
          ls -la staging
      - name: verify staging against git pins
        run: python3 tools/packaging/release/verify-inputs.py --pins tools/packaging/release-pins.json --staging staging --out verified-inputs.json
      - name: assemble release deterministically
        run: python3 tools/packaging/release/assemble.py --tag "$TAG" --src src --pins tools/packaging/release-pins.json --staging staging --work work --out dist
      - name: replace staging bytes with pipeline bytes
        # ADR-0012: releases publish exactly these five assets. Uploads only
        # overwrite same-name draft files, so a stray draft asset (e.g. an
        # evidence blob from an old staging process) would otherwise survive
        # and get published: both dist/ and the readback are compared against
        # the exact sorted name set, and any deviation fails before publish.
        # The pipeline never auto-deletes; the operator cleans the draft.
        run: |
          set -euo pipefail
          printf '%s\n' RELEASE-MANIFEST.json RELEASE-NOTES.md SHA256SUMS kryprobe-v0.1.0-linux-x86_64.tar.gz kryprobe-v0.1.0-source.tar.gz > asset-allowlist.txt
          ls -A dist | LC_ALL=C sort > dist-have.txt
          LC_ALL=C sort asset-allowlist.txt -o asset-allowlist.txt
          diff asset-allowlist.txt dist-have.txt || { echo "dist/ is not exactly the 5-asset allowlist" >&2; exit 1; }
          for f in dist/*; do
            gh release upload "$TAG" --repo "${{ github.repository }}" --clobber "$f"
          done
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '[.assets[] | .name] | sort | join("\n")'
      - name: download back and verify
        run: |
          set -euo pipefail
          rm -rf readback && mkdir readback
          gh release download "$TAG" --repo "${{ github.repository }}" --dir readback
          cmp dist/SHA256SUMS readback/SHA256SUMS
          (cd readback && sha256sum -c SHA256SUMS)
          ls -A readback | LC_ALL=C sort > readback-have.txt
          diff asset-allowlist.txt readback-have.txt || { echo "published asset set != 5-asset allowlist (stray draft assets?)" >&2; exit 1; }
          echo "readback verified: 5/5 assets"
      - name: record provenance summary
        run: |
          {
            echo "## Release $TAG"
            echo ""
            echo "- tag peel: \`$PEEL\`"
            echo "- tooling ref: \`$TOOLS_REF\` ($(git -C tools rev-parse HEAD))"
            echo "- exact-commit CI: ${{ needs.require-green.outputs.ci_run }}"
            echo "- outer seal: \`$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)\`"
            echo ""
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: publish
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "${{ github.repository }}" --title "KryProbe $TAG" --draft=false --latest
          gh release view "$TAG" --repo "${{ github.repository }}" --json tagName,isDraft,isPrerelease,publishedAt,url --jq '{tagName, isDraft, isPrerelease, publishedAt, url}'
