# SPDX-License-Identifier: GPL-3.0-or-later
# M1 Stage 2B helper crate, adopted as a workspace member in Stage 3.
# It consumes the frozen Stage 2A contract (kryprobe-core workload
# types, ADR-0012) via path dependency only.
[package]
name = "kryprobe-workload-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "kryprobe-workload-helper"
path = "src/main.rs"

[dependencies]
kryprobe-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
libc = "0.2"

# Local lint table (not `[lints] workspace = true`): binary-private
# modules use `pub` for the intended library surface, which the
# workspace `unreachable_pub` lint would deny under `-D warnings`.
# Every other entry mirrors the workspace table.
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
bare_trait_objects = "warn"

[lints.clippy]
useless_conversion = "warn"
