# SPDX-License-Identifier: GPL-3.0-or-later
# M1 Stage 2B helper crate. Standalone workspace on purpose: the product
# root manifest/lockfile have a single coordinator-owned writer (Stage 3
# integrates this crate as a workspace member). It consumes the frozen
# Stage 2A contract (kryprobe-core workload types, ADR-0012) via path
# dependency only and pins its registry deps to the product lockfile
# versions (serde 1.0.229, serde_json 1.0.151).
[package]
name = "kryprobe-workload-helper"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.98"

[workspace]

[[bin]]
name = "kryprobe-workload-helper"
path = "src/main.rs"

[dependencies]
kryprobe-core = { version = "=0.1.0", path = "../kryprobe-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
# No unreachable_pub: binary-private modules use `pub` for the intended
# Stage 3 library surface; the lint is inapplicable to binaries.
bare_trait_objects = "warn"

[lints.clippy]
useless_conversion = "warn"
