# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "kryprobe-cli"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "kryprobe"
path = "src/main.rs"

[dependencies]
kryprobe-abi = { path = "../kryprobe-abi" }
kryprobe-core = { path = "../kryprobe-core" }
kryprobe-policy = { path = "../kryprobe-policy" }
kryprobe-privilege = { path = "../kryprobe-privilege" }
kryprobe-report = { path = "../kryprobe-report" }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
kryprobe-testkit = { path = "../kryprobe-testkit" }
# 1B-M7: tests still gate on euid/errno constants; production code must
# never touch libc (ADR-0002 Rule B — absence here enforces it).
libc = "0.2"

[lints]
workspace = true
